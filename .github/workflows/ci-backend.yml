name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "pishkar/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "pishkar/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-backend.yml"

# Least-privilege default — only checkout/read code; no write access to
# issues, PRs, packages, or the repo itself. Override per-job if a step
# legitimately needs to write (e.g. uploading a release asset).
permissions:
  contents: read

# Cancel in-flight runs for the same ref so a quick second push doesn't
# burn minutes finishing an obsolete check. github.ref is the canonical
# safe value to key concurrency on — not user input.
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv (with Python 3.14)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy pishkar

      - name: Pytest
        run: uv run pytest -q
