name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same ref so a quick second push doesn't
# burn minutes finishing an obsolete check. github.ref is the canonical
# safe value to key concurrency on — not user input.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (with Python 3.14)
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy pishkar

      - name: Pytest
        run: uv run pytest -q
