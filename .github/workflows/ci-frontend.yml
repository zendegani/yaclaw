name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ci-frontend.yml"

# Least-privilege default — only checkout/read code; no write access to
# issues, PRs, packages, or the repo itself.
permissions:
  contents: read

# Cancel in-flight runs for the same ref so a quick second push doesn't
# burn minutes finishing an obsolete check. github.ref is the canonical
# safe value to key concurrency on — not user input.
concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build
