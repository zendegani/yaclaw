version: 2
updates:
  # Python backend (uv-managed) — uv.lock + pyproject.toml at repo root
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Collapse all minor/patch bumps into a single PR; majors stay separate
      python-dependencies:
        update-types:
          - minor
          - patch

  # Frontend (npm) — lives under ui/
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for all (prod + dev) minor/patch bumps; majors stay separate
      npm-dependencies:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
