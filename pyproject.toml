[project]
name = "pishkar"
version = "0.1.0"
description = "Personal AI butler"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2",
    "aiosqlite>=0.20",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "litellm>=1.50",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "httpx>=0.28.1",
    "pydantic-to-typescript>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pishkar"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
