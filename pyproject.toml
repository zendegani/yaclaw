[project]
name = "pishkar"
version = "0.1.0"
description = "Personal AI butler"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "aiosqlite>=0.20",
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.46.0",
    "litellm>=1.50",
    "python-dotenv>=1.0",
    "python-telegram-bot>=22.8",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# LLM-trace backends. Pick one (or neither):
#   uv sync --extra phoenix     # default — single container, Pi 5 friendly
#   uv sync --extra langfuse    # richer dashboards; needs more RAM (VPS)
phoenix = ["arize-phoenix-otel>=0.16.1"]
langfuse = ["langfuse>=4.12.0,<5"]
# Faster semantic-memory search (SQL-side cosine distance). Optional —
# without it, search falls back to a pure-Python scan.
memory = ["sqlite-vec>=0.1.6"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "httpx>=0.28.1",
    "pydantic-to-typescript>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pishkar"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
