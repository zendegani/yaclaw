# LangFuse — opt-in trace backend for VPS hosts (PISHKAR_TRACE_BACKEND=langfuse).
# Pinned to v2 (Postgres-only, ~1.5-2 GB resident) to avoid the v3
# ClickHouse footprint; too heavy for a Pi, fine on a small VPS.
#
#   1. Replace the three "changeme" values below (openssl rand -base64 32).
#   2. docker compose -f deploy/docker-compose.langfuse.yml up -d
#   3. Open http://localhost:3000, create an org + project, and copy the
#      project's public/secret keys into .env as LANGFUSE_PUBLIC_KEY /
#      LANGFUSE_SECRET_KEY.
services:
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      # Placeholder, not a live credential — replace before deploying.
      DATABASE_URL: postgresql://langfuse:changeme@db:5432/langfuse # trufflehog:ignore
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: changeme
      SALT: changeme
      TELEMETRY_ENABLED: "false"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: changeme # must match DATABASE_URL above
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db:/var/lib/postgresql/data

volumes:
  langfuse-db:
